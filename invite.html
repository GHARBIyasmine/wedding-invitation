<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de marriage</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
  .invite {
  position: relative;
  width: 100%;
  max-width: 600px;
}

/* First image defines the height naturally */
.invite img:first-child {
  position: relative; /* in flow — sets the container height */
  display: block;
  width: 100%;
  height: auto;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

/* All other images stack on top */
.invite img:not(:first-child) {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain; /* or cover depending on your PNGs */
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.invite img.visible {
  opacity: 1;
  transform: translateY(0);
}
.cal-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.cal-layer:first-child {
  position: relative;
  display: block;
  height: auto;
}

.local-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.local-layer:first-child {
  position: relative;
  display: block;
  height: auto;
}

#local-map {
  opacity: 0;
  transition: opacity 0.7s ease;
}
</style>
</head>
<body>
    <div class="invitation">
         <div  class="invite" style="position: relative;">
            <img class="layer" src="assets/August-0.png">
            <img class="layer" src="assets/August-1.png">
            <img class="layer" src="assets/August-2.png">
            <img class="layer" src="assets/August-3.png">
            <img class="layer" src="assets/August-4.png">
            <img class="layer" src="assets/August-5.png">
            <img class="layer" src="assets/August-6.png">
            <img class="layer" src="assets/August-7.png">
        </div>



    <div style="position: relative; width: 100%;">

  <!-- Stacked PNG layers -->
  <div class="calendar" style="position: relative; width: 100%;">
    <img class="cal-layer" src="assets/calendar-0.png">
    <img class="cal-layer" src="assets/calendar-1.png">
    <img class="cal-layer" src="assets/calendar-2.png">
    <img class="cal-layer" src="assets/calendar-3.png">
    <img class="cal-layer" src="assets/calendar-4.png">
    <img class="cal-layer" src="assets/calendar-5.png">
    <img class="cal-layer" src="assets/calendar-6.png">
    <img class="cal-layer" src="assets/calendar-7.png">
    <img class="cal-layer" src="assets/calendar-8.png">
    <img class="cal-layer" src="assets/calendar-9.png">
    <img class="cal-layer" src="assets/calendar-10.png">

    <!-- Countdown sits inside the same relative container, on top of all images -->
    <div class="countdown-wrapper" style="
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        opacity: 0;
    " id="cal-countdown">
      <div class="countdown">
        <div class="unit"><span class="number" id="days">00</span><span class="label">Jours</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="number" id="hours">00</span><span class="label">Heures</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="number" id="seconds">00</span><span class="label">Secondes</span></div>
      </div>
    </div>

  </div>
</div>

<div style="position: relative; width: 100%;">
  <div class="local" style="position: relative; width: 100%;">
    <img class="local-layer" src="assets/local-0.png">
    <img class="local-layer" src="assets/local-1.png">

    <div class="location" id="local-map" style="
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        aspect-ratio: 4 / 3;
        border-radius: 12px;
        overflow: hidden;
    ">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m16!1m11!1m3!1d300!2d10.2220329!3d36.8305578!2m2!1f0!2f90!3m2!1i1024!2i768!4f75!3m3!1m2!1s0x12fd3511fcdb24ff%3A0x1391b04218cc8630!2sLa%20Perle%20du%20Lac!4v1779731711032"
        width="100%"
        height="100%"
        style="border: 0; display: block;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <img class="local-layer" src="assets/local-2.png">
    <img class="local-layer" src="assets/local-3.png">
    <img class="local-layer" src="assets/local-4.png">
  </div>
</div>


    </div>

  <script>
  // ── Countdown ──────────────────────────────────────────────
  const weddingDate = new Date('2026-08-16T18:00:00');

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function tick() {
    const now  = new Date();
    const diff = weddingDate - now;

    if (diff <= 0) {
      document.getElementById('days').textContent    = '00';
      document.getElementById('hours').textContent   = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      return;
    }

    const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('days').textContent    = pad(days);
    document.getElementById('hours').textContent   = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);

  // ── Scroll animations ──────────────────────────────────────
  function animateBlock(layers, extra = [], delayBetween = 200) {
    layers.forEach((el, i) => {
      setTimeout(() => {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }, i * delayBetween);
    });

    extra.forEach(({ el, delay }) => {
      setTimeout(() => {
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        el.style.opacity = '1';
      }, delay);
    });
  }

  function observe(trigger, layers, extra = []) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateBlock(layers, extra);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    observer.observe(trigger);
  }

  // Invitation block
  observe(
    document.querySelector('.invite'),
    document.querySelectorAll('.invite img')
  );

  // Calendar block
  observe(
    document.querySelector('.calendar'),
    document.querySelectorAll('.cal-layer'),
    [{ el: document.getElementById('cal-countdown'), delay: 11 * 200 }]
  );

  // Local block
  observe(
    document.querySelector('.local'),
    document.querySelectorAll('.local-layer'),
    [{ el: document.getElementById('local-map'), delay: 2 * 400 }]
  );
</script>
</body>

</html>
