<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #502129;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow: hidden;
    }

    #envelope-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100vh;
      cursor: pointer;
      overflow: hidden;
    }

    #envelope-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #seal-hint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #line1 {
      position: absolute;
      top: 35%;               /* ← adjust to sit above the seal */
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: clamp(13px, 5vw, 29px);
      color: #fffcf2;
      letter-spacing: 0.08em;
      text-shadow: -3px 5px 8px rgb(0 0 0);
      text-align: center;
    }

    #lines-below {
      position: absolute;
      top: 69%;               /* ← adjust to sit below the seal */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: clamp(13px, 5vw, 29px);
      color: #fffcf2;
      letter-spacing: 0.08em;
      text-shadow: -3px 5px 8px rgb(0 0 0);
      line-height: 1.6;
      white-space: nowrap;
    }

    #line1 .letter,
    #line2 .letter,
    #line3 .letter {
      display: inline-block;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="envelope-wrapper">
    <video
      id="envelope-video"
      src="assets/envelope.mp4"
      playsinline
      preload="auto"
    ></video>

    <div id="seal-hint">
      <span id="line1">Vous êtes cordialement invités.</span>
      <div id="lines-below">
        <span id="line2">Cliquez ici pour ouvrir</span><br>
        <span id="line3">votre invitation.</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
  <script>
    const wrapper  = document.getElementById('envelope-wrapper');
    const video    = document.getElementById('envelope-video');
    const hint     = document.getElementById('seal-hint');

    let hasPlayed = false;
    let hintAnim = null;

    const startHint = setTimeout(() => {
      if (hasPlayed) return;

      ['line1', 'line2', 'line3'].forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = el.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
      });

      hintAnim = anime.timeline({ loop: true })
        .add({
          targets: '#line1 .letter',
          opacity: [0, 1],
          easing: 'easeInOutQuad',
          duration: 800,
          delay: (el, i) => 30 * (i + 1)
        })
        .add({
          targets: '#line2 .letter',
          opacity: [0, 1],
          easing: 'easeInOutQuad',
          duration: 800,
          delay: (el, i) => 30 * (i + 1)
        })
        .add({
          targets: '#line3 .letter',
          opacity: [0, 1],
          easing: 'easeInOutQuad',
          duration: 800,
          delay: (el, i) => 30 * (i + 1)
        })
        .add({
          targets: ['#line1', '#lines-below'],
          opacity: 0,
          duration: 1000,
          easing: 'easeOutExpo',
          delay: 1000
        });
    }, 300);

    wrapper.addEventListener('click', () => {
      if (hasPlayed) return;
      hasPlayed = true;

      clearTimeout(startHint);
      if (hintAnim) hintAnim.pause();

      anime({ targets: hint, opacity: 0, duration: 250, easing: 'easeOutQuad' });

      video.play();
    });

    video.addEventListener('ended', () => {
      anime({
        targets: wrapper,
        opacity: 0,
        duration: 1000,
        easing: 'easeInOutQuad',
        complete: () => {
          window.location.href = 'invite.html';
        }
      });
    });
  </script>

</body>
</html>
