<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="invitation">
         <div style="position: relative; display: block; width: 100%;">
            <video autoplay muted playsinline style="display: block; width: 100%;">
            <source src="assets/August.mp4" type="video/mp4">
            Your browser does not support the video tag.
            </video>
        </div>
    <div style="position: relative; display: block; width: 100%;">
    <video autoplay muted playsinline style="display: block; width: 100%;">
        <source src="assets/calendar.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Countdown overlaid on the video -->
    <div class="countdown-wrapper" style="
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
    ">
        <div class="countdown">

            <div class="unit">
                <span class="number" id="days">00</span>
                <span class="label">Jours</span>
            </div>

            <span class="colon">:</span>

            <div class="unit">
                <span class="number" id="hours">00</span>
                <span class="label">Heures</span>
            </div>

            <span class="colon">:</span>

            <div class="unit">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>

            <span class="colon">:</span>

            <div class="unit">
                <span class="number" id="seconds">00</span>
                <span class="label">Secondes</span>
            </div>

        </div>
    </div>

</div>

<!-- <img src="bg.svg" alt="invite" style="width: 100%; height: auto;"> -->

    </div>

    <script>
  // ── Set your wedding date here ──────────────────────────────
  const weddingDate = new Date('2026-08-16T18:00:00');
  // ────────────────────────────────────────────────────────────
 
  function pad(n) {
    return String(n).padStart(2, '0');
  }
 
  function tick() {
    const now  = new Date();
    const diff = weddingDate - now;
 
    if (diff <= 0) {
      document.getElementById('days').textContent    = '00';
      document.getElementById('hours').textContent   = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      return;
    }
 
    const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
 
    document.getElementById('days').textContent    = pad(days);
    document.getElementById('hours').textContent   = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }
 
  tick();
  setInterval(tick, 1000);
</script>
</body>

</html>
